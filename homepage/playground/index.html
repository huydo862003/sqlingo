      <h1>SQL Transpiler Playground</h1>
      <p>Convert SQL between 32 database dialects online. Powered by <a href="/sqlingo/">sqlingo</a>, the TypeScript port of SQLGlot.</p>

      <h2>Supported Conversions</h2>
      <p>Transpile SQL between: MySQL, Postgres, BigQuery, Snowflake, DuckDB, SQLite, Hive, Spark, Trino, Oracle, Redshift, and MSSQL.</p>

      <h2>SQL to DBML</h2>
      <p>Convert CREATE TABLE statements from any SQL dialect to <a href="https://dbml.dbdiagram.io/">DBML</a> format for database documentation and diagramming.</p>

      <h2>How It Works</h2>
      <p>Everything runs locally in your browser. No data is sent to any server. sqlingo parses your SQL into an AST, then generates it in the target dialect.</p>
